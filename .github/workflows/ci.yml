name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: mojibake guard
        run: node scripts/check-mojibake.mjs src convex index.html
      - name: typecheck
        run: npx tsc -b
      - name: tests
        run: npx vitest run tests
      - name: convex functions compile
        run: npx tsc --noEmit -p convex
      - name: production build
        run: npm run build
