<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>offline — hooked.</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #08080c; color: #f4f2ee;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center; padding: 24px;
      }
      .wordmark { font-weight: 900; letter-spacing: -.03em; font-size: 28px; }
      .dot { color: #ff3d71; }
      h1 { font-size: 20px; margin: 18px 0 8px; }
      p { color: #9a97a3; line-height: 1.6; max-width: 34ch; margin: 0 auto 22px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #ff3d71; color: #0b0b10; font-weight: 700; font-size: 14px;
        padding: 13px 26px; border-radius: 999px;
      }
      .hint { margin-top: 14px; font-size: 12px; color: #55525e; }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark">hooked<span class="dot">.</span></div>
      <h1>You're offline</h1>
      <p>The deck needs the network to deal new songs. Everything you already saved is safe on this device.</p>
      <button onclick="location.reload()">try again</button>
      <p class="hint">This page works with no connection at all — it's stored on your phone.</p>
    </main>
  </body>
</html>
