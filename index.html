<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The host serving this build ignores public/_headers, so the policy is
      declared here instead — a meta CSP is enforced by the browser exactly like
      the header. What it cannot carry is frame-ancestors and HSTS, which are
      header-only by spec; those still need the Cloudflare transform rule
      documented in SELF_HOSTED_CONVEX.md. Until that rule exists, framing is
      refused by public/frame-guard.js.
      connect-src is filled in at build time from VITE_CONVEX_URL and
      VITE_CONVEX_SITE_URL (vite.config.ts), so it follows the backend.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src https: blob:; connect-src __CONVEX_CONNECT__; frame-src https://checkout.razorpay.com https://api.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- zoom stays enabled: disabling it fails WCAG 1.4.4 and iOS ignores it anyway -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="hookedcue is a swipe-based music discovery app for finding new songs from 30-second previews. Skip, save, ask for more like this, or block artists with four gestures." />
    <meta name="keywords" content="music discovery app, swipe music app, discover new songs, song recommendations, 30 second song previews, find new music" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#08080C" />
    <meta name="application-name" content="hookedcue" />
    <meta name="apple-mobile-web-app-title" content="hookedcue" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://app.hookedcue.com/" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>hookedcue - Swipe your next favorite song</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="hookedcue" />
    <meta property="og:title" content="hookedcue - Swipe your next favorite song" />
    <meta property="og:description" content="Find new music from 30-second hooks. Four swipes teach hookedcue what to play next." />
    <meta property="og:url" content="https://app.hookedcue.com/" />
    <meta property="og:image" content="https://app.hookedcue.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://app.hookedcue.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="hookedcue swipe-based music discovery app preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="hookedcue - Swipe your next favorite song" />
    <meta name="twitter:description" content="Find new music from 30-second hooks. Four swipes teach hookedcue what to play next." />
    <meta name="twitter:image" content="https://app.hookedcue.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- JSON-LD lives in an external file: it lets script-src drop
         'unsafe-inline' entirely (SEO crawlers follow the src fine) -->
    <script type="application/ld+json" src="/structured-data.json"></script>
    <script src="/frame-guard.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 720px; margin: 12vh auto; padding: 24px; color: #f4f2ee; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1>hookedcue - swipe your next favorite song</h1>
        <p>
          hookedcue is a music discovery app that plays short song previews and learns your taste from four gestures:
          skip, save, more like this, and never again.
        </p>
        <p>Enable JavaScript to use the interactive swipe deck.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
